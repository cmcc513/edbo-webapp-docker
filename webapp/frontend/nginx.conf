# edbo frontend — nginx: serves the built SPA and reverse-proxies /api to the
# "backend" compose service. The frontend always calls relative /api/* URLs
# (see src/api/client.ts), so the same build works behind any reverse proxy.

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Descriptor CSVs / result tables are uploaded through /api.
    client_max_body_size 50m;

    # ---- API -> FastAPI backend --------------------------------------------
    location /api/ {
        proxy_pass         http://backend:8100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Descriptor computation (RDKit) and model fitting can be slow.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- hashed build assets: cache aggressively ---------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA history fallback (react-router) -------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
