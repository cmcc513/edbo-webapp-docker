# edbo 化学反应贝叶斯优化平台 —— Docker Compose 编排
#
# 用法(在 webapp/ 目录下执行):
#   docker compose up -d --build     # 构建并后台启动
#   docker compose logs -f backend   # 查看后端日志
#   docker compose ps                # 查看容器状态
#   docker compose down              # 停止(数据卷 edbo_data 保留)
#   docker compose down -v           # 停止并删除数据(慎用!)
#
# 启动后访问:  http://localhost:8080
#
# 说明:两个服务的构建上下文都是【仓库根目录】,因为后端镜像需要根目录下的
# edbo 算法包与 setup.py。.dockerignore 已排除 node_modules / data 等大目录。
name: edbo

services:
  backend:
    build:
      context: ..
      dockerfile: webapp/backend/Dockerfile
    image: edbo-backend:0.1.0
    restart: unless-stopped
    environment:
      MPLBACKEND: "Agg"          # 无显示器环境:matplotlib 使用非交互后端
      PYTHONUNBUFFERED: "1"
    volumes:
      # SQLite(edbo.db)+ dill pickle + 描述符 CSV,持久化在命名卷中。
      - edbo_data:/srv/backend/data
    expose:
      - "8100"                   # 仅容器网络内暴露,由 frontend(nginx)反代
    # ports:
    #   - "8100:8100"            # 如需直接访问 API(如仪器对接),取消注释
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/api/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ..
      dockerfile: webapp/frontend/Dockerfile
    image: edbo-frontend:0.1.0
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 对外端口,可用环境变量覆盖:  EDBO_PORT=9000 docker compose up -d
      - "${EDBO_PORT:-8080}:80"

volumes:
  edbo_data:
